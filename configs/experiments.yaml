# Матриця: models × prompts × sampling (× repeats).
# Ціни — $ за 1M токенів. Перевір актуальні перед прогоном.

models:
  haiku:
    provider: anthropic
    model: claude-haiku-5-5
    price_in: 0.10            # промпти до 100k токенів
    price_out: 0.50
    price_cache_read: 0.01
    price_cache_write: 0.125
    send_top_p: false         # частина моделей Claude не приймає temperature разом із top_p
    concurrency: 4
  qwen:
    provider: ollama
    model: qwen3:4b-instruct-2507   # 2–4B: має працювати на ноутбуці ментора
    num_ctx: 8192             # без цього Ollama тихо обрізає довгі чеки
    think: false              # гібридні qwen3 за замовчуванням міркують -> завищені latency і токени
    hardware: "TODO: CPU/GPU, RAM сервера Ollama"   # потрапляє в meta.json; latency включає мережу VPS -> сервер
    concurrency: 1

prompts: [v1, v2]

sampling:
  t0:
    temperature: 0.0
    top_p: 1.0
    repeats: 1
  t07:
    temperature: 0.7
    top_p: 0.9
    repeats: 3                # стохастична конфігурація без повторів — нечесне порівняння

timeout_s: 120
max_reask: 1                  # одна спроба виправлення, далі status=failed
