# Матриця: models × prompts × sampling (× repeats).
# Ціни — $ за 1M токенів. Перевір актуальні перед прогоном.

models:
  haiku:                      # Claude Haiku 5.5 через OpenRouter (OpenAI-сумісний API)
    provider: openai
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: anthropic/claude-haiku-5.5
    price_in: 0.10            # $ / 1M, промпти до 100k токенів; звір на openrouter.ai
    price_out: 0.50
    # На OpenRouter провайдер Haiku не оголошує підтримку response_format: з require_parameters: true
    # запит отримував 404 «no endpoints». Тому схема йде в system-промпт, а JSON перевіряє наш код (+1 re-ask).
    schema_in_prompt: true
    concurrency: 4
  # haiku_direct:             # той самий Haiku напряму через Claude API (потрібен ANTHROPIC_API_KEY)
  #   provider: anthropic
  #   model: claude-haiku-5-5
  #   price_in: 0.10
  #   price_out: 0.50
  #   price_cache_read: 0.01
  #   price_cache_write: 0.125
  #   concurrency: 4
  qwen:
    provider: ollama
    model: qwen3.5:4b              # 4B: має працювати на ноутбуці ментора
    num_ctx: 8192             # без цього Ollama тихо обрізає довгі чеки
    think: false              # qwen3.5 за замовчуванням міркує -> завищені latency і токени; потрібна Ollama >= 0.31.2
    hardware: "CPU only, 16 ядер (14 потоків для Ollama), 48 ГБ RAM"   # потрапляє в meta.json; latency включає мережу VPS -> сервер
    num_thread: 14            # CPU-потоки Ollama на виклик: лишаємо 2 ядра з 16 системі
    concurrency: 1            # по одному запиту: паралельні запити ділять ті самі ядра

  # Додаткові локальні моделі (той самий сервер Ollama). Запуск: --models granite_tiny granite42 gemma_e2b gemma_e4b
  granite_tiny:
    provider: ollama
    model: granite4:tiny-h    # гібрид Mamba + MoE: мала кількість активних параметрів -> швидка на CPU
    num_ctx: 8192
    think: null               # якщо Ollama скаже «does not support thinking» — саме так і має бути
    hardware: "CPU only, 16 ядер (14 потоків для Ollama), 48 ГБ RAM"
    num_thread: 14
    concurrency: 1
  granite42:
    provider: ollama
    model: granite4.2:3b
    num_ctx: 8192
    think: false               # якщо `ollama show` покаже capability thinking — постав false
    # ReadTimeout 120 с на кожному чеку: модель або міркує, або зациклюється в JSON.
    # Стеля токенів обриває зациклення -> видно, що саме генерувала (last_raw в errors.md)
    num_predict: 2048
    timeout_s: 300
    hardware: "CPU only, 16 ядер (14 потоків для Ollama), 48 ГБ RAM"
    num_thread: 14
    concurrency: 1
  gemma_e2b:
    provider: ollama
    model: gemma4:e2b
    num_ctx: 8192
    think: false
    hardware: "CPU only, 16 ядер (14 потоків для Ollama), 48 ГБ RAM"
    num_thread: 14
    concurrency: 1
  gemma_e4b:
    provider: ollama
    model: gemma4:e4b
    num_ctx: 8192
    think: false
    hardware: "CPU only, 16 ядер (14 потоків для Ollama), 48 ГБ RAM"
    num_thread: 14
    concurrency: 1

prompts: [v1, v2]

sampling:
  t0:
    temperature: 0.0
    top_p: 1.0
    repeats: 1
  t07:
    temperature: 0.7
    top_p: 0.9
    repeats: 3                # стохастична конфігурація без повторів — нечесне порівняння

timeout_s: 120
max_reask: 1                  # одна спроба виправлення, далі status=failed
