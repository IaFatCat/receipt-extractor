[project]
name = "receipt-extractor"
version = "0.1.0"
description = "Витягування даних з чеків для авансових звітів: платна vs локальна модель"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ocr = ["opencv-python-headless>=4.9", "pytesseract>=0.3.10"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extractor"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
